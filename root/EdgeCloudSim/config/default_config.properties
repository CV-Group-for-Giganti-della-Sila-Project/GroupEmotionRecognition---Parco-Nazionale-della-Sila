# Simulation time is in minutes in config, then SimSettings converts to seconds
simulation_time=600
warm_up_period=0

# Logging intervals are also in minutes
vm_load_check_interval=1
location_check_interval=1
ap_delay_check_interval=1

file_log_enabled=true
deep_file_log_enabled=false

min_number_of_mobile_devices=1
max_number_of_mobile_devices=10
mobile_device_counter_size=1

# Network
wlan_range=100
wan_propagation_delay=0.1
gsm_propagation_delay=0
lan_internal_delay=0.005

# Bandwidth values are read as Mbps and multiplied by 1000 internally
wlan_bandwidth=100
man_bandwidth=0
wan_bandwidth=50
gsm_bandwidth=0

# Cloud settings
number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=1
core_for_cloud_vm=4
mips_for_cloud_vm=100000
ram_for_cloud_vm=16000
storage_for_cloud_vm=1000000

# Mobile/local VM settings.
# Required by SimSettings even if you do not use local processing.
core_for_mobile_vm=1
mips_for_mobile_vm=1000
ram_for_mobile_vm=1024
storage_for_mobile_vm=10000

# Your scenario and policy names
orchestrator_policies=EDGE_VLM_ONLY
simulation_scenarios=PARK_CAMERA_VLM

# Geographic bounds. Can be dummy values for a fixed-camera scenario.
northern_bound=100
southern_bound=0
eastern_bound=100
western_bound=0

# Required by SimSettings even if FixedCameraMobilityModel ignores them
attractiveness_L1_mean_waiting_time=1
attractiveness_L2_mean_waiting_time=1
attractiveness_L3_mean_waiting_time=1